services:
  - type: web
    name: ssci-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sscomputerinstitute.com
      - key: CONSULTANCY_TEAM_EMAIL
        value: sscomputerinstitutenlr@gmail.com, ugssolutions1@gmail.com
      - key: EMAIL_FROM
        value: '"Sri Shanmukha Computer Institute" <ugssolutions1@gmail.com>'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
